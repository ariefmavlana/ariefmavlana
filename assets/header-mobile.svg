<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title description">
  <title id="title">Arief Maulana — Full-Stack Developer</title>
  <desc id="description">Based in Bandung, Indonesia. Web applications, from interface to deployment. mavlana.space.</desc>
  <style>
    .surface { fill: #f6f5f1; }
    .ink { fill: #222824; }
    .muted { fill: #576159; }
    .rule { stroke: #d4d9d2; }
    .accent { fill: #526b50; }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #161b18; }
      .ink { fill: #f1f3ed; }
      .muted { fill: #b1bcb1; }
      .rule { stroke: #39443b; }
      .accent { fill: #a4bc98; }
    }
  </style>
  <rect class="surface" width="600" height="360" rx="4"/>
  <rect class="accent" x="28" y="29" width="4" height="18"/>
  <text class="muted" x="45" y="44" font-size="19" font-weight="600" letter-spacing="1.3">FULL-STACK DEVELOPER</text>
  <text class="ink" x="24" y="130" font-size="65" font-weight="600" letter-spacing="-2.5">Arief Maulana</text>
  <text class="muted" x="28" y="176" font-size="24">Web applications, from</text>
  <text class="muted" x="28" y="210" font-size="24">interface to deployment.</text>
  <path class="rule" d="M28 246H572" fill="none"/>
  <text class="muted" x="28" y="283" font-size="21">Bandung, Indonesia</text>
  <text class="ink" x="28" y="324" font-size="21" font-weight="600">mavlana.space</text>
</svg>
