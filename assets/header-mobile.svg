<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title description">
  <title id="title">Arief Maulana — Full-Stack Developer</title>
  <desc id="description">Based in Bandung, Indonesia. Web applications, from interface to deployment. mavlana.space.</desc>
  <style>
    .surface { fill: #f6f5f1; }
    .ink { fill: #222824; }
    .muted { fill: #576159; }
    .rule { stroke: #d4d9d2; }
    .accent { fill: #526b50; }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #161b18; }
      .ink { fill: #f1f3ed; }
      .muted { fill: #b1bcb1; }
      .rule { stroke: #39443b; }
      .accent { fill: #a4bc98; }
    }
    .name { animation: enter 700ms ease-out both; }
    .primary { animation: primary 16s ease-in-out infinite; }
    .secondary { opacity: 0; animation: secondary 16s ease-in-out infinite; }
    .sweep { animation: sweep 9s ease-in-out infinite; }
    @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes primary { 0%, 40%, 100% { opacity: 1; } 44%, 98% { opacity: 0; } }
    @keyframes secondary { 0%, 46%, 96%, 100% { opacity: 0; } 50%, 92% { opacity: 1; } }
    @keyframes sweep { 0%, 15% { transform: translateX(0); opacity: 0; } 25%, 75% { opacity: 1; } 90%, 100% { transform: translateX(500px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .name, .primary, .secondary, .sweep { animation: none; }
      .sweep { opacity: 0; }
    }
  </style>
  <rect class="surface" width="600" height="360" rx="4"/>
  <rect class="accent" x="28" y="29" width="4" height="18"/>
  <text class="muted" x="45" y="44" font-size="19" font-weight="600" letter-spacing="1.3">FULL-STACK DEVELOPER</text>
  <text class="ink name" x="24" y="130" font-size="65" font-weight="600" letter-spacing="-2.5">Arief Maulana</text>
  <g class="muted primary" font-size="24">
    <text x="28" y="176">Web applications, from</text>
    <text x="28" y="210">interface to deployment.</text>
  </g>
  <g class="muted secondary" font-size="24" aria-hidden="true">
    <text x="28" y="176">Full-stack systems</text>
    <text x="28" y="210">and applied AI.</text>
  </g>
  <path class="rule" d="M28 246H572" fill="none"/>
  <rect class="accent sweep" x="28" y="245" width="44" height="2"/>
  <text class="muted" x="28" y="283" font-size="21">Bandung, Indonesia</text>
  <text class="ink" x="28" y="324" font-size="21" font-weight="600">mavlana.space</text>
</svg>
