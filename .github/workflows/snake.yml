# Generates an animated "snake eats your contributions" SVG (light + dark)
# and publishes it to a branch called `output`, which the README references.
#
# Requirements (one-time):
#   Repo -> Settings -> Actions -> General -> Workflow permissions
#   -> select "Read and write permissions" -> Save
#
# This version publishes with plain git and the built-in GITHUB_TOKEN,
# so it has no third-party deploy action that could break or be deprecated.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual run button in the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Verify the SVGs were generated
        run: |
          ls -la dist
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg

      - name: Publish to the output branch
        run: |
          cd dist
          git init -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update contribution snake"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin output