# Generates an animated "snake eats your contributions" SVG (light + dark)
# and publishes it to a branch called `output`, which the README references.
#
# Optional manual alternative to `node scripts/update-snake.mjs`.
name: Generate contribution snake

on:
  workflow_dispatch:          # manual run button in the Actions tab

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23526b50&color_dots=%23f6f5f1,%23cbd7c4,%239bad8f,%236f8864,%23475f42
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a4bc98&color_dots=%23161b18,%2339433b,%235e7559,%238ba17d,%23b6cba7

      - name: Verify the SVGs were generated
        run: |
          ls -la dist
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg

      - name: Publish to the output branch
        run: |
          cd dist
          git init -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update contribution snake"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin output
